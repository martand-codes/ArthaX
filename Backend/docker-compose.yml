version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: arthax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - arthax-db-data:/var/lib/postgresql/data
    networks:
      - arthax-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arthax-db-data:

networks:
  arthax-network:
    driver: bridge